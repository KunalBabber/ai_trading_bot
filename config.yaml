seed: 42

data:
  timeframe: "5m"
  sequence_length: 96
  horizon_bars: 12
  fee_rate: 0.0005
  slippage_rate: 0.0002

model:
  hidden_size: 96
  num_layers: 2
  dropout: 0.20
  learning_rate: 0.0005
  batch_size: 128
  epochs: 40
  patience: 7

strategy:
  long_probability: 0.58
  short_probability: 0.58
  min_expected_return: 0.0015
  stop_loss: 0.008
  take_profit: 0.016
  risk_per_trade: 0.003
  max_position_fraction: 0.20
  max_daily_loss: 0.02

exchange:
  symbol: "BTCUSD"
  resolution: "5m"
  leverage: 10
  dry_run: true
  poll_interval_sec: 15
  default_order_size: 1
  min_order_size: 1

